name: Build SLA.GD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: "android64"
          export-pdb: false

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: SLA.GD
          path: "*.geode"
